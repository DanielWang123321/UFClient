[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ugclient-core"
version = "0.3.2"
description = "UGClient computation sidecar (kinematics / dynamics over JSON-RPC WebSocket)"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Daniel Wang"}]
# ufactory_genesis is NOT listed here: upstream only supports a source checkout
# + `pip install -e .`. scripts/fetch_ufg.py clones it at the pinned commit below.
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
    "packaging>=24",
    "websockets>=13,<18",
    "pin==4.0.0",
    "xarm-python-sdk>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

[project.scripts]
ugclient-core = "ugclient_core.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ugclient_core*"]

[tool.ugclient.ufactory_genesis]
repository = "https://github.com/xArm-Developer/ufactory_genesis.git"
# Pinned commit: v0.3.10 (Robotiq 2F-85/2F-140 + 11 mm flange adapter, mounting plates, unified xArm link_base inertials).
commit = "c167f1e"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]
