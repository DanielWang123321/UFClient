name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  build-linux:
    name: Build Linux (deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build sidecar & sync assets
        run: |
          python scripts/fetch_ufg.py
          python -m pip install --upgrade pip
          python -m pip install -e third_party/ufactory_genesis -e "core[dev]"
          python scripts/build_sidecar.py
          python scripts/sync_assets.py
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Tauri build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles deb --config src-tauri/tauri.bundle.conf.json
      - name: Checksums
        run: |
          cd apps/desktop/src-tauri/target/release/bundle/deb
          sha256sum *.deb > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/deb/SHA256SUMS-linux.txt
          if-no-files-found: error

  build-windows:
    name: Build Windows (NSIS exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: core/environment-win.yml
          environment-name: ugclient-win
          init-shell: bash
          cache-environment: true
      - name: Build sidecar & sync assets
        run: |
          python scripts/fetch_ufg.py
          python -m pip install --no-deps "xarm-python-sdk>=1.14" -e third_party/ufactory_genesis -e core
          python scripts/build_sidecar.py
          python scripts/sync_assets.py
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Tauri build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles nsis --config src-tauri/tauri.bundle.conf.json
      - name: Checksums
        run: |
          cd apps/desktop/src-tauri/target/release/bundle/nsis
          ls -la
          sha256sum *.exe | tr -d '\r' > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS-windows.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS-linux.txt
          sha256sum -c SHA256SUMS-windows.txt
          sha256sum *.deb *.exe > SHA256SUMS.txt
          rm -f SHA256SUMS-linux.txt SHA256SUMS-windows.txt
          cat SHA256SUMS.txt
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "UGClient ${GITHUB_REF_NAME}" \
              --notes-file "${GITHUB_WORKSPACE}/docs/release-notes/${GITHUB_REF_NAME}.md"
            gh release upload "${GITHUB_REF_NAME}" *.deb *.exe SHA256SUMS.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" --title "UGClient ${GITHUB_REF_NAME}" \
              --notes-file "${GITHUB_WORKSPACE}/docs/release-notes/${GITHUB_REF_NAME}.md" \
              *.deb *.exe SHA256SUMS.txt
          fi
